name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet fsi manage.fsx format --check

      - name: Check benchmarks compile
        run: dotnet fsi manage.fsx benchcheck

      - name: Examples
        run: dotnet fsi manage.fsx examples

      - name: Build docs
        run: |
          dotnet tool restore
          dotnet fsdocs build --clean --parameters root /TDesu.FSharp/
